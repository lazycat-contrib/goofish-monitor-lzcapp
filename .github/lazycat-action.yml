version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: ai-goofish
build:
  toolchains: []
  run_buildscript: false
images:
  - id: ai-goofish
    target: service
    service: app
    source: ghcr.io/usagi-org/ai-goofish
    channel: stable
    sort: semver
    tag_regex: ^latest$
    delivery:
      mode: mirror
      require_digest_match: true
